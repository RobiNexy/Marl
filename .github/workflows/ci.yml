name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install fossil
        run: |
          wget -q https://fossil-scm.org/home/uv/fossil-linux-x64 -O /usr/local/bin/fossil
          chmod +x /usr/local/bin/fossil
          fossil version
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test ./... -race -count=1

  build-cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows, android]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: android
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build binary
        run: |
          go build -trimpath -ldflags "-s -w" -o marl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/marl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # CGO 全关：modernc sqlite 是纯 Go；跨平台构建不依赖目标平台工具链
          #（android 无 NDK 也能出产物——termux 直跑）。
          CGO_ENABLED: 0
      - uses: actions/upload-artifact@v4
        with:
          name: marl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: marl-*
